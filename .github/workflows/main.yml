
name: Windows RDP NRB Minecraft

on:
  workflow_dispatch:
    inputs:
      restore_run_id:
        description: "Previous workflow run ID for workspace restore (optional)"
        required: false
        type: string
      keep_alive_minutes:
        description: "Runner lifetime in minutes (1-340)"
        required: false
        default: "300"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-rdp-nrb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Microsoft OpenJDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Prepare workspace and restore backup
        shell: pwsh
        env:
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = Join-Path $env:GITHUB_WORKSPACE "RDP-Workspace"
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null

          @"
          Workspace files are backed up as the RDP-Workspace artifact.
          The Windows OS and installed applications are temporary.
          "@ | Set-Content (Join-Path $workspace "README.txt") -Encoding UTF8

          if ($env:RESTORE_RUN_ID -and $env:RESTORE_RUN_ID.Trim()) {
            if ($env:RESTORE_RUN_ID -notmatch '^\d+$') {
              throw "restore_run_id must contain digits only."
            }
            gh run download $env:RESTORE_RUN_ID `
              --repo $env:GITHUB_REPOSITORY `
              --name RDP-Workspace `
              --dir $workspace

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Restore failed; continuing with workspace."
            }
          }

      - name: Configure RDP account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add RDP_PASSWORD in repository Actions secrets."
          }
          if ($env:RDP_PASSWORD.Length -lt 14) {
            throw "RDP_PASSWORD must be at least 14 characters."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "NRB" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "NRB" -Password $securePassword
          } else {
            New-LocalUser -Name "NRB" `
              -Password $securePassword `
              -Description "Temporary RDP account" `
              -PasswordNeverExpires | Out-Null
          }

          Add-LocalGroupMember -Group "Administrators" `
            -Member "NRB" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member "NRB" -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "RDP configured for temporary runner."

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          timeout: 3m

      - name: Install Minecraft Launcher
        shell: pwsh
        continue-on-error: true
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget install --id Mojang.MinecraftLauncher `
              --exact --silent `
              --accept-source-agreements `
              --accept-package-agreements

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Minecraft Launcher installation failed."
            }
          } else {
            Write-Warning "winget unavailable; skipping installation."
          }

      - name: Upload initial workspace backup
        uses: actions/upload-artifact@v5
        with:
          name: RDP-Workspace
          path: RDP-Workspace/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

      - name: Show connection details
        shell: pwsh
        run: |
          Write-Host "Tailscale IPv4 address:"
          tailscale ip -4
          Write-Host "RDP username: NRB"
          Write-Host "Use the Tailscale IP in your RDP client."
          Write-Host "Your password is stored in RDP_PASSWORD."

      - name: Keep runner alive
        shell: pwsh
        env:
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          $minutes = 300
          if ($env:KEEP_ALIVE_MINUTES -match '^\d+$') {
            $minutes = [int]$env:KEEP_ALIVE_MINUTES
          }
          if ($minutes -lt 1) { $minutes = 1 }
          if ($minutes -gt 340) { $minutes = 340 }

          $deadline = (Get-Date).AddMinutes($minutes)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 60
            Write-Host "Runner active: $(Get-Date -Format o)"
          }

      - name: Upload final workspace backup
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: RDP-Workspace
          path: RDP-Workspace/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
          
