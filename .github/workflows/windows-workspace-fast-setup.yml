
name: Windows Workspace - Fast Setup

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: "Runner lifetime in minutes (1-340)"
        required: false
        default: "60"
        type: string

permissions:
  contents: read

concurrency:
  group: windows-workspace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-workspace:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = Join-Path $env:GITHUB_WORKSPACE "RDP-Workspace"
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          "Workspace files are backed up as an artifact. Windows itself is temporary." |
            Set-Content (Join-Path $workspace "README.txt") -Encoding UTF8

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Configure temporary RDP account
        if: ${{ secrets.RDP_PASSWORD != '' }}
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RDP_PASSWORD.Length -lt 14) {
            throw "RDP_PASSWORD must be at least 14 characters."
          }

          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser -Name "NRB" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "NRB" -Password $securePassword
          } else {
            New-LocalUser -Name "NRB" -Password $securePassword `
              -Description "Temporary RDP account" -PasswordNeverExpires | Out-Null
          }

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "NRB" -ErrorAction SilentlyContinue
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Connect to Tailscale
        if: ${{ secrets.TS_AUTHKEY != '' }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          timeout: 3m

      - name: Set up Minecraft Launcher
        shell: pwsh
        continue-on-error: true
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget install --id Mojang.MinecraftLauncher --exact --silent `
              --accept-source-agreements --accept-package-agreements
          } else {
            Write-Warning "winget unavailable; skipping Minecraft Launcher."
          }

      - name: Show Tailscale connection details
        if: ${{ secrets.TS_AUTHKEY != '' }}
        shell: pwsh
        run: |
          Write-Host "Tailscale IPv4 address:"
          tailscale ip -4
          Write-Host "RDP username: NRB"
          Write-Host "Use your RDP_PASSWORD secret to connect."

      - name: Upload workspace backup
        uses: actions/upload-artifact@v5
        with:
          name: RDP-Workspace
          path: RDP-Workspace/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

      - name: Keep runner alive
        shell: pwsh
        env:
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          $minutes = 60
          if ($env:KEEP_ALIVE_MINUTES -match '^\d+$') {
            $minutes = [int]$env:KEEP_ALIVE_MINUTES
          }
          if ($minutes -lt 1) { $minutes = 1 }
          if ($minutes -gt 340) { $minutes = 340 }

          $deadline = (Get-Date).AddMinutes($minutes)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 60
            Write-Host "Runner active: $(Get-Date -Format o)"
          }

      - name: Upload final workspace backup
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: RDP-Workspace
          path: RDP-Workspace/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
          
